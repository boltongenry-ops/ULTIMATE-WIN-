name: Publish Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test the packaged application on Windows
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {throw 'Tag must match VERSION'}
          try {
            ./tests/windows-smoke.ps1 -Archive "dist/UltimateWin-$version-win-x64.zip"
          } catch {
            $message = $_.Exception.GetBaseException().Message + ' ' + $_.ScriptStackTrace
            Write-Output ("::error::" + ($message -replace '[\r\n]+',' '))
            exit 1
          }
  publish:
    if: github.ref_type == 'tag'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the tagged Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/UltimateWin.exe "dist/UltimateWin-${GITHUB_REF_NAME#v}-win-x64.zip" --verify-tag --title "Ultimate Win $GITHUB_REF_NAME" --notes "Приложение для Windows x64 с поддержкой OpenCode Go."
